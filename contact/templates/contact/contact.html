{% extends 'base.html' %}
{% load static %}
{% block title %}Contact | Forefront HQ{% endblock %}

{% block content %}
<div class="">

<!-- Contact details -->
        <div class="">






        </div>

    <!-- Contact form -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <form method="POST">
                {% csrf_token %}

                <h2>Send a message</h2>

                <div class="form-group">
                    <label class="field-label">Name <span class="req">*</span></label>
                    <input type="text" name="Name" class="field" placeholder="Name" required>
                </div>

                <div class="form-group">
                        <label class="field-label">Email address <span class="req">*</span></label>
                        <input type="email" name="email" class="field" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="field-label">Service of Interest</label>
                     <select name="services" class="field" placeholder="Select a service" required>
                        <option value="Select a service" disabled>Select a service</option>
                        <option value="Software Development">Software Development</option>
                        <option value="Digital Marketing">Digital Marketing</option>
                        <option value="Consultation">Consultation</option>
                        <option value="Other">Other...</option>
                    </select>
                </div>
                

                <div class="form-group">
                    <label class="field-label">Your Message <span class="req">*</span></label>
                    <textarea name="message" class="field" rows="20" cols="15" required>Tell us about your project...</textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Submit</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
